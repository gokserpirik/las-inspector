[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "las-inspector"
version = "0.1.0"
description = "ASPRS LAS/LAZ quality control inspector"
requires-python = ">=3.12"
license = {file = "LICENSE"}
readme = "README.md"
keywords = ["lidar", "point-cloud", "las", "laz", "quality-control"]
dependencies = [
    "numpy>=1.20.0,<2.0.0",
    "matplotlib>=3.4.0,<4.0.0",
    "lazrs>=0.5.0,<1.0.0",
    "laspy>=2.0.0,<3.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/gokserpirik/las-inspector"
Repository = "https://github.com/gokserpirik/las-inspector"

[project.scripts]
las-inspector = "las_inspector:main"

[tool.setuptools]
py-modules = ["las_inspector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
